server {
    listen 80;
    listen [::]:80;
    server_name niffler-test.123.253.224.101.sslip.io;

    client_max_body_size 16m;

    location = /InfiniteCanvas {
        return 301 /InfiniteCanvas/;
    }

    location /InfiniteCanvas/ {
        proxy_pass https://lingweave.167.254.241.191.sslip.io;
        proxy_http_version 1.1;
        proxy_set_header Host lingweave.167.254.241.191.sslip.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_ssl_server_name on;
        proxy_ssl_name lingweave.167.254.241.191.sslip.io;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:18084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
