name: Build App Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Extra image tag to publish
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: app-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ryfinez/niffler

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  gateway:
    name: Build gateway linux-amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: app-image-x86_64-unknown-linux-musl
          workspaces: . -> target

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build gateway
        env:
          AETHER_VERSION: ${{ github.sha }}
          CARGO_TERM_COLOR: always
        run: cross build --release --locked -p aether-gateway --target x86_64-unknown-linux-musl

      - name: Upload gateway artifact
        uses: actions/upload-artifact@v5
        with:
          name: aether-gateway-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/aether-gateway
          if-no-files-found: error
          retention-days: 1

  image:
    name: Build and push image
    needs: [frontend, gateway]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Prepare image context
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/aether-gateway-linux-amd64/aether-gateway dist/aether-gateway-amd64
          chmod +x dist/aether-gateway-amd64
          cp -r artifacts/frontend-dist dist/frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '' }}
          flavor: |
            latest=false

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      - name: Build amd64 image tar
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --file ./Dockerfile.app \
            --tag niffler-app:latest \
            --tag niffler-app:${GITHUB_SHA} \
            --output type=docker,dest=/tmp/niffler-app-linux-amd64.tar \
            .

      - name: Upload amd64 image tar
        uses: actions/upload-artifact@v5
        with:
          name: niffler-app-linux-amd64
          path: /tmp/niffler-app-linux-amd64.tar
          if-no-files-found: error
          retention-days: 7
