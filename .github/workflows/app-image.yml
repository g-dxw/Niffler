name: Build App Image

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: app-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_checks:
    name: Verify deployment tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check deployment scripts
        run: |
          bash -n scripts/check-deploy-ancestry.sh
          bash -n scripts/deploy-ci-artifact.sh
          bash -n scripts/fixed-production-deployer.sh
          bash -n scripts/actions-production-ssh-command.sh
          bash -n scripts/actions-production-deploy.sh
          bash -n scripts/install-actions-production-access.sh
          bash -n scripts/verify-ssh-host-key.sh
          bash -n scripts/fixed-test-deployer.sh
          bash -n scripts/actions-test-ssh-command.sh
          bash -n scripts/install-actions-test-access.sh
          python3 -m py_compile scripts/filter-niffler-test-export.py
          bash -n scripts/tests/test-deploy-ancestry.sh
          bash -n scripts/tests/test-fixed-production-deployer.sh
          bash -n scripts/tests/test-actions-production-access.sh
          bash -n scripts/tests/test-deploy-ci-restricted.sh
          bash -n scripts/tests/test-production-workflow.sh
          bash -n scripts/tests/test-verify-ssh-host-key.sh
          bash -n scripts/tests/test-fixed-test-deployer.sh
          bash -n scripts/tests/test-actions-test-ssh-command.sh
          python3 scripts/tests/test-filter-niffler-test-export.py
          bash scripts/tests/test-deploy-ancestry.sh
          bash scripts/tests/test-fixed-production-deployer.sh
          bash scripts/tests/test-actions-production-access.sh
          bash scripts/tests/test-deploy-ci-restricted.sh
          bash scripts/tests/test-production-workflow.sh
          bash scripts/tests/test-verify-ssh-host-key.sh
          bash scripts/tests/test-fixed-test-deployer.sh
          bash scripts/tests/test-actions-test-ssh-command.sh

  frontend:
    name: Build frontend
    needs: release_checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run type-check
          npm run test:run
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  gateway:
    name: Build gateway linux-amd64
    needs: release_checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: app-image-x86_64-unknown-linux-musl
          workspaces: . -> target

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Check gateway
        run: |
          cargo fmt --all --check
          cargo check --locked -p aether-gateway

      - name: Build gateway
        env:
          AETHER_VERSION: ${{ github.sha }}
          CARGO_TERM_COLOR: always
        run: cross build --release --locked -p aether-gateway --target x86_64-unknown-linux-musl

      - name: Upload gateway artifact
        uses: actions/upload-artifact@v7
        with:
          name: aether-gateway-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/aether-gateway
          if-no-files-found: error
          retention-days: 1

  image:
    name: Build image tar
    needs: [release_checks, frontend, gateway]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare image context
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/aether-gateway-linux-amd64/aether-gateway dist/aether-gateway-amd64
          chmod +x dist/aether-gateway-amd64
          cp -r artifacts/frontend-dist dist/frontend

      - name: Build amd64 image tar
        run: |
          set -euo pipefail
          docker build \
            --file ./Dockerfile.app \
            --build-arg TARGETARCH=amd64 \
            --build-arg AETHER_VERSION="${GITHUB_SHA}" \
            --tag niffler-app:latest \
            --tag niffler-app:${GITHUB_SHA} \
            .
          docker save niffler-app:latest niffler-app:${GITHUB_SHA} \
            --output /tmp/niffler-app-linux-amd64.tar

      - name: Upload amd64 image tar
        uses: actions/upload-artifact@v7
        with:
          name: niffler-app-linux-amd64
          path: /tmp/niffler-app-linux-amd64.tar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to test01 niffler-test
    needs: image
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    environment:
      name: niffler-test
      url: ${{ vars.NIFFLER_TEST_PUBLIC_URL }}
    concurrency:
      group: niffler-test-deploy
      cancel-in-progress: false
    steps:
      - name: Download exact image artifact
        uses: actions/download-artifact@v8
        with:
          name: niffler-app-linux-amd64
          path: artifacts

      - name: Setup SSH
        env:
          SSH_HOST: ${{ vars.NIFFLER_TEST_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.NIFFLER_TEST_SSH_PRIVATE_KEY }}
          SSH_HOST_FINGERPRINT: ${{ secrets.NIFFLER_TEST_SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ -z "${SSH_HOST}" ]]; then
            echo "NIFFLER_TEST_HOST is required" >&2
            exit 1
          fi
          if [[ -z "${SSH_HOST_FINGERPRINT}" ]]; then
            echo "NIFFLER_TEST_SSH_HOST_FINGERPRINT is required" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          scan_file="$(mktemp)"
          public_key_file="$(mktemp)"
          fingerprint_file="$(mktemp)"
          trap 'rm -f "${scan_file}" "${public_key_file}" "${fingerprint_file}"' EXIT
          ssh-keyscan -H "${SSH_HOST}" > "${scan_file}"
          if [[ ! -s "${scan_file}" ]]; then
            echo "ssh-keyscan returned no host keys for ${SSH_HOST}" >&2
            exit 1
          fi

          awk 'NF >= 3 { print $2, $3 }' "${scan_file}" > "${public_key_file}"
          if [[ ! -s "${public_key_file}" ]]; then
            echo "ssh-keyscan returned no parseable public keys for ${SSH_HOST}" >&2
            exit 1
          fi

          ssh-keygen -lf "${public_key_file}" -E sha256 | awk '{print $2}' > "${fingerprint_file}"
          if [[ ! -s "${fingerprint_file}" ]]; then
            echo "failed to calculate SSH host fingerprints for ${SSH_HOST}" >&2
            exit 1
          fi
          if ! grep -Fxq -- "${SSH_HOST_FINGERPRINT}" "${fingerprint_file}"; then
            echo "SSH host fingerprint mismatch for ${SSH_HOST}" >&2
            exit 1
          fi

          install -m 600 "${scan_file}" ~/.ssh/known_hosts

      - name: Upload and deploy exact image artifact
        env:
          SSH_HOST: ${{ vars.NIFFLER_TEST_HOST }}
          SSH_USER: ${{ vars.NIFFLER_TEST_USER }}
          REMOTE_DIR: ${{ vars.NIFFLER_TEST_REMOTE_DIR }}
          PUBLIC_URL: ${{ vars.NIFFLER_TEST_PUBLIC_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${SSH_USER}" || -z "${REMOTE_DIR}" || -z "${PUBLIC_URL}" ]]; then
            echo "NIFFLER_TEST_USER, NIFFLER_TEST_REMOTE_DIR and NIFFLER_TEST_PUBLIC_URL are required" >&2
            exit 1
          fi
          if [[ "${REMOTE_DIR}" != "/opt/niffler-test" ]]; then
            echo "NIFFLER_TEST_REMOTE_DIR must be /opt/niffler-test" >&2
            exit 1
          fi

          image_tar="artifacts/niffler-app-linux-amd64.tar"
          test -s "${image_tar}"
          ssh_target="${SSH_USER}@${SSH_HOST}"

          ssh "${ssh_target}" "niffler-test receive ${GITHUB_SHA}" < "${image_tar}"
          ssh "${ssh_target}" "niffler-test deploy ${GITHUB_SHA}"

          curl -fsS --max-time 20 "${PUBLIC_URL%/}/health"
