name: Promotion Policy

on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: promotion-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promotion_policy:
    name: Promotion policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Verify promotion source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/check-promotion-source.sh \
            --repository "${{ github.repository }}" \
            --head-repository "${{ github.event.pull_request.head.repo.full_name }}" \
            --head-owner "${{ github.event.pull_request.head.repo.owner.login }}" \
            --head-ref "${{ github.head_ref }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}"
